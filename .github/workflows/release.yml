name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_artifact:
    name: Build release artefact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Set up Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81 # v3.26
        with:
          version: '0.115.1'

      - name: Check release version parser
        run: nu scripts/test-release-version.nu

      - name: Build and test release archive
        env:
          EXPECTED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          VITE_HITKEEP_HOST: https://stats.lkroll.com
        run: nu scripts/build-release.nu --expected-tag "$EXPECTED_TAG" --hitkeep-host "$VITE_HITKEEP_HOST"

      - name: Upload tested release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-explorer-${{ github.sha }}
          path: |
            release/ep-explorer-*.tar.gz
            release/ep-explorer-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish_release:
    name: Publish GitHub release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build_artifact
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ep-explorer-${{ github.sha }}
          path: release

      - name: Verify checksum
        working-directory: release
        run: sha256sum --check ep-explorer-*.tar.gz.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/ep-explorer-*.tar.gz
          release/ep-explorer-*.tar.gz.sha256
          --verify-tag
          --generate-notes
          --notes "Source commit: $GITHUB_SHA"
          --latest
          --title "Release ${GITHUB_REF_NAME#v}"
