title = "Build and modernise the custom Three.js facade for Scala 2.13"
body = """
Scope: Treat the unpublished Bathtor/threejs-facade fork as its own dependency project. Inspect its build and pin an exact source revision; update it as needed to produce a Scala 2.13.18 / Scala.js 1.x artefact with a build toolchain runnable on JDK 25 OpenJ9. Preserve the existing Three.js r88 API/runtime pairing unless a concrete incompatibility requires a separate decision. Provide a reproducible way for ep-explorer and CI to build and consume the facade from a clean checkout. Application source fixes belong to epexplorer-y3b.

Acceptance: The facade builds for Scala.js 1 and Scala 2.13; a clean ep-explorer checkout can resolve the facade without a pre-existing unpublished local artefact; the source revision, bootstrap commands, and any local publication step are pinned and documented; the facade version and Three.js runtime remain compatible. Report any verified API break or required migration before expanding scope.

Estimate: roughly 20-60 LOC for source pin/bootstrap integration, 30-150 LOC for facade build changes, and 0-500 LOC for compatibility fixes once inspected. If inspection suggests over 1000 LOC total, split the migration into smaller tasks before implementation."""
