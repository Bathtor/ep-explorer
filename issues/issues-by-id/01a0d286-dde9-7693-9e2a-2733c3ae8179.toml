title = "Choose and implement a sustainable Three.js integration"
body = "Decision: Use an app-local Scala.js facade for the subset of Three.js used by ep-explorer, with a pinned JavaScript runtime installed by Bun. This umbrella is split into two child tasks. epexplorer-1xa first inlines the used r88 facade and helpers and packages the r88 browser runtime locally, eliminating the unpublished fork artefact. epexplorer-oup then upgrades the runtime, facades, addon imports and app code to a pinned modern Three.js release. The modernisation can follow the first working r88 build rather than blocking it. epexplorer-y3b owns remaining generic Scala.js compilation, page, serving and README work after the first child. Keep both phases reproducible from a clean checkout. Estimate: first child about 490-1100 LOC, second about 430-1100 LOC; each must be re-split if verified work exceeds 1000 LOC."
