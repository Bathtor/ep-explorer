title = "Update sbt and Scala.js build tooling"
body = """
Scope: Move project/build.properties and build plugins from sbt 1.3.2 and Scala.js 0.6.31 to a supported, mutually compatible toolchain. Replace obsolete Workbench and sbt syntax as needed so the build definition loads on a documented supported JDK. Keep the production JavaScript entry point requirements visible for the later application port.

Acceptance: A clean checkout can start sbt and evaluate the build definition without unpublished local artifacts; document the required JDK and startup command; record the selected plugin versions and any replacement for Workbench. Compilation and browser behaviour are covered by later tasks.

Estimate: roughly 80-250 LOC across build files and development documentation. If the plugin migration itself requires broad source changes, keep those changes in the application port task."""
