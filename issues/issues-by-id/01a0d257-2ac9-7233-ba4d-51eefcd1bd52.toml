title = "Update sbt and Scala.js build tooling"
body = """
Scope: Move sbt and Scala.js build tooling to versions that load on the current JDK 25 OpenJ9. Keep application dependency updates and runnable browser output in their linked tasks.

Implementation for review: Pinned sbt 2.0.9, Scala.js plugin 1.22.0, sbt-buildinfo 0.13.2, and sbt-scalafmt 2.6.2. Removed Workbench and its localUrl setting, the retired Bintray resolver, and obsolete jsDependencies build keys. Switched platform dependencies to sbt 2 notation. Kept the JavaScript resource files; their former load order is recorded in epexplorer-y3b. Removed obsolete development instructions from the public README until a working build makes accurate instructions possible.

Validation: The build definition loaded with sbt -batch show scalaVersion on JDK 25 OpenJ9 in the workspace and in an isolated directory containing only the build files, returning Scala 2.12.10. git diff --check passed. Application compilation and browser behaviour remain acceptance criteria for epexplorer-mda and epexplorer-y3b.

Original failure: The sbt 1.3.2 launcher failed before project loading on JDK 25 OpenJ9 with a Scala 2.12.10 bad constant pool index error and an unsupported Security Manager error."""
