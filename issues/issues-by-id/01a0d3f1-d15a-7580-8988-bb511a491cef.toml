id = "01a0d84c-ec42-7200-b179-a57250943b9d"
author = "codex"
body = "Investigation and proposal (awaiting agreement): Reproduced in the local preview at close inner-system zoom, the default zoom, a wider outer-system zoom, and after rotating the viewpoint. The guide rings stay centred on Sol and retain their expected relative radii, but their labels sit at differing azimuths. DistanceMarker samples each circular ConstantOriginOrbit at Main.starttime. OrbitalSnapshot.path begins at the current mean anomaly, which varies by radius because orbital period varies; label.moveTo(path(0)) therefore puts each static label at a different phase. The 360-point path also omits its endpoint, and CatmullRomCurve3 is open by default, leaving a roughly one-degree seam near that anchor. Proposed correction: sample static guide rings at zero time (mean anomaly zero), close the curve, and keep the label at path(0), placing all labels at the same +X azimuth on their own rings. Keep the existing distance values and scale. After agreement, visually check 0.1, 0.5, 1 and 10 AU at close/default/wide zoom and from a tilted viewpoint."
created_at = "2026-09-25T11:21:55.010189Z"

