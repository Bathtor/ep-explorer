title = "Investigate AU marker alignment in the inner system"
body = """
The AU distance rings and their labels appear oddly aligned in the inner Solar System view; this predates the Three.js upgrade. Reproduce the layout at several zoom levels and viewpoints, compare marker placement with the corresponding ring geometry and the outer system, and inspect DistanceMarker orbit path and label anchor. Identify the cause and propose a small correction before implementation. Acceptance: document the cause with a concrete before/after placement proposal; if agreed, implement and visually verify representative inner-system markers without changing their distances.

Agreed plan (2026-09-25): Build the static distance-marker path at zero time so its starting point and label anchor lie at the same +X azimuth for every radius. Close the CatmullRomCurve3 path so the ring has no seam. Leave the AU values and distance scale unchanged. Build and visually inspect representative 0.1, 0.5, 1 and 10 AU markers at close and wide zoom levels and from another viewpoint. Estimated implementation: 2 lines in DistanceMarker, 1 facade overload in Geometry, under 10 LOC total.

Follow-up prototype requested (2026-09-25): Name the closed constructor argument and place four labels per guide ring at 90-degree intervals so their usefulness and clutter can be reviewed in the live preview. Keep the same radii and ring geometry. Estimated additional implementation: 10-20 LOC in DistanceMarker."""
