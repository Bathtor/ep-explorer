title = "Review synthetic overlay intersection point"
body = "TacticalOverlay.intersectObject currently converts a screen-space offset as though it were an absolute screen position, then calls project where unproject may be intended. The resulting Intersection.point is not read by the current selection path. Decide whether that field is needed: remove the unused calculation and simplify the intersection representation if possible, or compute a meaningful world-space point and cover it with a focused test. Keep overlay hit selection behaviour intact. Estimate: 15-60 LOC plus a focused test if retained."
