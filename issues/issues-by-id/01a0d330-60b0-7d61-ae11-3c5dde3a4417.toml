body = "Implemented agreed narrow correction: world-space distance now uses the overlay position before projecting a cloned vector; coordinate variable names state NDC, pixel, and world space; removed unused synthetic point and fields and narrowed the Intersection facade. Existing circular hit threshold and priority code are unchanged. Validation: fastLinkJS succeeded, Test / test passed 4 existing tests in Safari, git diff --check passed. No focused overlay regression test was added because this Scala.js test target cannot directly import Three.js modules; the current tests do not exercise overlay selection."
created_at = "2026-09-25T11:57:29.339944Z"

