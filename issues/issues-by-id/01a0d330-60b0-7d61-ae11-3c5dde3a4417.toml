title = "Review synthetic overlay intersection point"
body = "Correct tactical overlay intersections without introducing coordinate wrapper types. Keep the existing pixel hit test and selection priority rules. In TacticalOverlay, use names that state whether coordinates are in world space, normalised device coordinates, or screen pixels; calculate distance from the camera to the overlay centre in world space before projecting a separate copy for hit testing. Remove the unused synthetic intersection point and other unused synthetic fields, and narrow the local Intersection facade to the fields the application reads (distance and object). Validate with compilation/tests and a focused check of overlay hit ordering where feasible. Estimated implementation: 15-40 LOC plus validation."
