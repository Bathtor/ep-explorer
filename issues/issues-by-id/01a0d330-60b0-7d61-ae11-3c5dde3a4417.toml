[[comments]]
id = "01a0d862-23d9-7db2-bebf-934f517be798"
author = "codex"
body = "Review findings: the synthetic point converts a pixel displacement with an absolute-position transform, projects in the wrong direction, and then assigns NDC depth to the result. No application consumer reads Intersection.point. A related active bug is that pos.project(camera) mutates pos before camera.position.distanceTo(pos), mixing world and NDC coordinates; IntersectionPriority sorts by that distance. Proposed correction, not yet agreed: narrow the local Intersection facade to the consumed distance/object fields, remove the unused synthetic point and extra literal fields, and calculate overlay distance to the unprojected overlay centre. Preserve the existing inclusive circular pixel hit test and category priority rules; overlapping-hit distance ordering will intentionally change. Existing test harness uses NoModule and cannot directly import Three.js, so focused runtime coverage needs a small bundled harness or an agreed test configuration adjustment. No implementation performed."
created_at = "2026-09-25T11:45:05.497004Z"

[[comments]]
id = "01a0d868-6e16-79b3-91f8-be108ffbbb09"
author = "codex"
body = "User agreed to F2: remove the unused synthetic intersection point. F1 scope remains under discussion: user requested an estimate for coordinate newtypes across most of the viewer. Initial inspection suggests staged work: typed picking and projection boundaries (roughly 250-450 changed lines including tests), graphics positions and camera tracking (additional 250-450), and orbital/geographic frames and unit conversions (additional 450-800). Broad migration is roughly 950-1700 changed lines and should be split into independently reviewable tasks once scope is agreed. Wrapping mutable Three.js vectors must prevent projection from mutating a value that retains its old coordinate-space type; conversions should return distinct values and raw-vector access should stay at explicit interop boundaries. No implementation performed."
created_at = "2026-09-25T11:51:57.718209Z"

