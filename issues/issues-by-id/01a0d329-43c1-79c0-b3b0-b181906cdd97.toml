body = "Research findings (proposal, not agreed implementation): build is Scala 2.13.18 / Scala.js 1.22.0 / sbt 2.0.9; formatter engine is pinned to 2.0.0-RC4. Scalastyle has IfBraceChecker with singleLineAllowed=false and doubleLineAllowed=false, and ImportOrderChecker, but documented plugin support is sbt 0.13/1.0; standalone CLI would avoid plugin linkage but retains old parser/tool maintenance risk. Scalafix has sbt 2 support and syntactic rules do not require SemanticDB or application compilation. DisableSyntax has opt-in restrictions but no documented mandatory-braces or mandatory-semicolons setting; robust enforcement needs AST/token-based custom rules, not regex. Modern Scalafmt supports import grouping, but brace insertion requires a preceding newline and therefore misses same-line unbraced branches. WartRemover focuses on semantic safety and does not address the requested punctuation policy. Recommendation: small local Scalafix syntactic brace rule, formatter-based imports if an upgrade produces acceptable churn, optional narrow semicolon rule after examples are agreed. Estimated LOC: integration/config/docs 40-80; brace rule 30-60; rule fixtures/tests 80-140; import config/docs 20-40 (total 170-320). Semicolon extension roughly 180-330 including tests. These exclude existing-source remediation; survey violations before agreeing cleanup scope. Validate sbt 2 local-rule wiring first. Proposed policies: braces for all present if/else branch bodies, including expression-valued conditionals; allow conventional else-if chains. Semicolon policy must distinguish block result expressions, definitions, imports, and braced constructs. No implementation made. Sources: https://github.com/scalacenter/sbt-scalafix/releases ; https://scalacenter.github.io/scalafix/docs/developers/local-rules.html ; https://scalacenter.github.io/scalafix/docs/rules/DisableSyntax ; https://www.scalastyle.org/rules-1.0.0.html ; https://www.scalastyle.org/sbt.html ; https://scalameta.org/scalafmt/docs/configuration.html ; https://www.wartremover.org/doc/warts.html"
