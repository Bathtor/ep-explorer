id = "01a0d329-43c1-79c0-b3b0-b181906cdd97"
ref = "epexplorer-9zr"
title = "Enforce Scala conditional braces and top-level import style"
body = """
Agreed scope and implementation: Scala linting through Scalafix for multiline conditional braces and file/package-level imports. Mandatory semicolon linting is out of scope.

Conditional policy: Entirely single-line if expressions are allowed, with or without else. If the conditional spans lines, present branch bodies require braces. Conventional else-if chains do not need an extra block around the nested if. This applies in statement and expression contexts; absent else is allowed. A local syntactic rule reports positions and never rewrites source.

Import policy: Only imports directly in a source file or package body are checked. Class/object/method/block imports are untouched, including relative and unused local imports. Top-level imports use project (com.lkroll.ep.mapviewer), then Java/Scala standard library, then third-party groups separated by blank lines; Scala.js is third-party. Ordinary named imports and grouped selectors use ASCII order, preserving existing grouped syntax. The rule avoids reordering wildcards, aliases, exclusions and explicitly imported implicits because their order may affect resolution. Relative top-level imports are diagnosed using resolved symbols rather than prefix guesses. Unused top-level imports are diagnosed from compiler warnings. Wildcards are neither created nor collapsed. All checks are diagnostic-only.

Integration: sbt-scalafix 0.14.9 is pinned. SemanticDB and -Wunused:imports support the import rule. Local rule compilation is JVM-only despite the Scala.js application build. Existing Scalafmt 2.0.0-RC4 settings remain, except AsciiSortImports is removed to avoid competing ownership of imports. No lint rewrite runs on compile. The documented check is sbt -batch scalafixAll --check, covering main and test source trees and excluding generated sources by default. No import-fix command or branch is added; no changes are staged.

Implementation note: Built-in OrganizeImports was trialled in check-only mode and proposed edits to imports inside object bodies, including their removal. That contradicted the agreed scope, so a focused local Scalafix rule was used instead. The custom checker is deliberately conservative around semantically order-sensitive imports. Existing top-level import violations remain for a separate, reviewed source clean-up; the check currently fails on them. No broad import rewrite or formatter run has been applied.

Validation: Accepted and rejected brace fixtures cover single-line conditionals, multiline branches, else-if, missing/explicit else, nesting, comments and suppression. Import fixtures cover group/selector order, group spacing, Java/Scala/Scala.js classification, relative imports, unused imports, aliases/wildcards, and preservation of nested imports. Targeted positive checks pass and negative fixtures yield expected diagnostics. The syntax-only project check and sbt compile pass. Full project check fails on existing import violations. sbt test reached Safari but its Scala.js test runner terminated; a Node override could not run because Node is unavailable. Scalafmt check reports ten pre-existing formatting deviations and was not applied.

Review and next step: Review the rule/configuration and representative import findings before any broad import cleanup. The source cleanup is intentionally pending; only close this issue after user agreement. Estimated implementation scale remains below 1000 LOC; source cleanup can be split into a separate child issue if desired."""
