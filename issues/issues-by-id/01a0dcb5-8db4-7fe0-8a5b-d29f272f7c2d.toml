title = "Make Scala compilation pass with -Werror"
body = """
Goal: make fresh Scala 2.13.18 compilation and tests pass with -Werror, and enforce that in CI.

Baseline (2026-09-26): the current build enables only -Wunused:imports. A fresh detailed compile reports 929 deprecations, one unused import, and one feature warning. The previously reported non-exhaustive Options.scala match is already fixed at the current HEAD.

Agreed plan (2026-09-26):

1. Replace the scalac options with -deprecation, -feature, -Wunused:imports, and -Werror so CI emits actionable diagnostics and rejects all warnings.
2. Keep the existing unit DSL. The 867 auto-application warnings for º, ºd, m, km, kg, and AU are caused by empty parameter lists in local datamodel/ExtraUnits.scala, not Squants. Make those six pure conversion extensions parameterless. Squants 1.8.3 is already the latest published release.
3. Add parentheses at the four remaining genuine auto-application calls: normalise, name, and two scala.util.control.Breaks.break calls.
4. Apply the compiler-suggested explicit Unit result type to the 55 procedure-syntax declarations.
5. Replace two deprecated LeftProjection.get uses without changing the failure behaviour; replace the by-name eta expansion with () => default; remove the unused import; and opt in locally to implicit conversions in Orbit.scala.
6. Validate a fresh warning-free test compile, Scalafix checks, and production linking. Do not add broad warning suppressions or exceptions.

Estimated scope: roughly 80 source/configuration lines, because the unit warnings are resolved at their seven local definitions rather than at 867 call sites.
"""
