id = "01a0d877-b56e-7121-8dc2-c22625748b50"
ref = "epexplorer-xuj"
title = "Add CI workflow to publish the static release archive"
body = """
Agreed plan, updated after review on 2026-09-25

Implement the EPtools-style release flow. Manual workflow_dispatch builds and tests from checkout, then uploads the versioned archive and checksum as an Actions artefact without publishing. A pushed stable vMAJOR.MINOR.PATCH tag must match the sbt version, run the same build and tests, download and verify the tested artefact, then create a GitHub release from the existing tag. The workflow never creates or pushes tags.

Share JDK 21, sbt, Node 22, and Bun 1.4.2 setup between normal CI and release CI with a local composite action. Keep Node because the Linux Scala.js tests use NodeJSEnv; macOS tests use Safari. Release CI additionally sets up Nushell. Keep frozen Bun installation and the full Scala.js test suite before the Vite production build.

Make the release builder accept an optional --hitkeep-host argument. With no argument, produce a generic site with no tracker host, even if VITE_HITKEEP_HOST is inherited. Release CI alone passes https://stats.lkroll.com from its workflow configuration. Keep the host out of the release script and README.

Package dist/ as ep-explorer-<version>.tar.gz containing one website root, omitting planet.psd. Generate a standard SHA-256 checksum. Upload both files under a commit-specific Actions artefact name; on tags, verify the checksum after download and publish both files with release notes identifying the source commit. Do not enable source maps. Leave browser smoke testing and retirement of deploy.sh in parent epexplorer-5r3.

Keep README release guidance brief: local build command, checksum verification, manual workflow run, and matching tag publication. Point to the release workflow for toolchain details; do not list build dependencies, Hitkeep configuration, asset inventories, or URL patterns there.

Validate both workflow files with actionlint and test configured and unconfigured local release builds by inspecting generated output and checksum. Preserve all existing staged files and never stage or unstage changes. Compare the result with this plan and mark in review; close only after user approval.

Estimate for review amendments: local composite action 30-45 LOC; workflow references 15-25 changed LOC; script argument 5-15 LOC; README reduction about 20-25 removed LOC. Well below 1000 LOC."""
