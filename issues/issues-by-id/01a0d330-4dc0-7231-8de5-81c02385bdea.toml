title = "Revisit JavaScript bundle minification"
body = "After the runnable site and modern Three.js integration settle the asset pipeline, decide whether and how to minify the browser JavaScript assets. Measure bundle size and load cost, preserve any globals required by Scala.js, retain required third-party licence notices, and verify the result in a browser. The current r88 build concatenates ordered classic scripts; Three.js itself ships as three.min.js, while local add-ons remain unminified. Estimate: 20-80 LOC if the chosen pipeline needs an extra build step."
