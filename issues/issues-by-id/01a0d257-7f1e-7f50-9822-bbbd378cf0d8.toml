title = "Add GitHub Actions CI for build and tests"
body = """
Scope: Add a simple GitHub Actions workflow for pushes and pull requests. Install the documented JDK and sbt toolchain, cache downloaded dependencies safely, and run compilation, the non-empty automated test suite, and the production Scala.js output task from a clean checkout.

Acceptance: CI succeeds on a clean runner without Maven Local, Bintray, or private credentials; a compile, test, or production linking failure fails the workflow; README identifies the local equivalent and the workflow runs on pull requests. Avoid deployment or publishing in this task.

Estimate: roughly 40-100 LOC of workflow and documentation changes."""
