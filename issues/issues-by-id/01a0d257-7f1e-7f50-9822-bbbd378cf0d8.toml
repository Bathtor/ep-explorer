title = "Add GitHub Actions CI for build and tests"
body = """
Scope: Add a GitHub Actions workflow for pushes and pull requests that runs compilation, the non-empty test suite, and the production Scala.js build from a clean checkout. Use /Users/lkroll/Programming/EclipsePhase/eptools/.github/workflows/release.yml as the concrete reference for checkout, Nix setup, pinned source dependency bootstrap, build and smoke-test steps, checksums, and artefact upload. Also consult eptools/scripts/bootstrap-release-dependencies.nu and eptools/scripts/build-release.nu. Adapt the release artefact handling to the static site tar archive rather than the eptools server JAR; coordinate that packaging with the existing static release task.

Acceptance: CI runs on pull requests and succeeds on a clean runner without pre-existing locally published dependencies or private credentials; it can build any unpublished facade dependency from pinned source as part of setup; a compile, test, or production linking failure fails the workflow. The workflow validates the static tar archive once the release packaging task supplies it. README identifies the local equivalent. Publishing a GitHub release remains in the static release task.

Estimate: about 20-60 LOC of workflow and documentation changes, excluding dependency bootstrap and tar packaging tracked with the build and release work."""
