title = "Add GitHub Actions CI for build and tests"
body = "Agreed plan (2026-09-25): Add a GitHub Actions CI workflow for pushes and pull requests. Install JDK 21, sbt, Bun and Node directly on the runner with pinned setup actions; do not add Nix. From a clean checkout, run Bun frozen dependency installation, clean Scala compilation and the full non-empty Scala.js test suite, then the production Vite build. Fail the workflow on compile, test or production build errors. Pin scalajs-java-time to the currently resolved release and remove the Maven-local resolver, checking that public dependencies resolve without local artefacts. Keep this CI task validation-only: no tar packaging, artefact upload or GitHub release publishing; static release task epexplorer-5r3 owns those. Add only a concise README command block for the local equivalent. Validate workflow syntax and local commands where available. Estimated 45-70 LOC across workflow, build and README, plus any minimal setup required; below 1000 LOC. Do not stage changes. Compare final implementation to this plan and mark in review; close only after user agrees."
