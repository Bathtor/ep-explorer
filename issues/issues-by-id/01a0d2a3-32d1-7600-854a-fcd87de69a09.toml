title = "Inline the used Three.js r88 facade and package its runtime locally"
body = "Scope: Copy only the Scala.js facade declarations and Scala helper behaviour used by ep-explorer from the unpublished r88 fork into this repository. Keep the r88 global THREE API in this phase, remove the external org.denigma facade dependency, and retain the existing local addon scripts as needed. Pin three@0.88.0 with Bun and a committed lockfile. Stage the core browser script and required addon scripts as local assets in deterministic load order, with no CDN or Vite. Coordinate generic Scala.js compilation and serving work with epexplorer-y3b. Acceptance: A clean checkout resolves without a locally published facade; used facade APIs and helpers are local; the pinned local Three runtime is delivered before the Scala.js application; record any unrelated compilation failures for epexplorer-y3b. Estimate: roughly 400-800 LOC of facade declarations, 50-180 LOC of helpers and call-site fixes, and 40-120 LOC of packaging, potentially around 1100 LOC at the high end. If extraction exceeds that, split a further coherent piece before implementing."
