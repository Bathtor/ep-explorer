title = "Inline the used Three.js r88 facade and package its runtime locally"
body = "Agreed approach: First inline only the Scala.js facade declarations and Scala helper behaviour used by ep-explorer from the unpublished r88 fork. Keep the r88 global THREE API and remove the org.denigma facade artefact dependency. Pin three@0.88.0 with Bun and commit bun.lock. Generate the existing epmapviewer-jsdeps.js locally from the installed r88 browser build and required existing addon scripts in deterministic load order, before the Scala.js application script. A small Bun build script is sufficient; no CDN and no Vite. Scala remains connected to the browser global through @JSGlobal in this phase. General compilation, serving and development instructions remain in epexplorer-y3b. Acceptance: clean checkout resolves without a locally published facade; used facade APIs and helpers are local; the generated local JS dependency bundle loads before the Scala.js output; record unrelated compilation failures for epexplorer-y3b. Estimate: roughly 400-800 LOC of facade declarations, 50-180 LOC of helpers and call-site fixes, and 40-120 LOC of packaging, potentially around 1100 LOC at the high end. Re-split a coherent piece if verified scope exceeds 1000 LOC."
