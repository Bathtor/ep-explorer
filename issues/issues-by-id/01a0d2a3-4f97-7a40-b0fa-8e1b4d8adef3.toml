title = "Upgrade the inlined facade and runtime to modern Three.js"
body = "Upgrade the app-local Scala.js facades and browser runtime from Three.js r88 to pinned r186 through Bun and Vite. Agreed approach: direct Scala.js ES module imports for core and official addons; BufferGeometry for custom and generated geometry; retain Points labels and manual hover behaviour; use CanvasTexture where appropriate; use modern colour management with sRGB textures and OutputPass, then iterate visually if needed; target modern browsers. Remove obsolete r88 scripts and bootstrap. Verify build and both scene views, orbital paths, labels, overlays and hover, selection, controls, textures and post-processing in Safari. Keep this task open for user review. Estimated 350-650 added or modified LOC plus removal of legacy JavaScript, so total diff may exceed 1000 LOC; split larger optional visual redesigns into later tasks."
