title = "Upgrade the inlined facade and runtime to modern Three.js"
body = "Agreed follow-on approach: Start from the locally inlined r88 facade and runnable browser build. Select and pin a modern Three.js release. Migrate the local Scala.js facades and application call sites to modern APIs, emit a Scala.js ES module with @JSImport references to three and official addons, and use Bun to bundle the linked output and installed dependency for the browser. Replace removed Geometry APIs, legacy global addon scripts, and obsolete post-processing and colour handling. No Vite is planned unless a concrete need emerges. Acceptance: reproducible clean-checkout compilation and linking; browser smoke check covers scene rendering, controls, intersections, labels and post-processing; obsolete r88 assets removed. Estimate: roughly 350-900 LOC of facade and application migration plus 80-200 LOC of bundling and page wiring. Re-estimate and split again if verified scope exceeds 1000 LOC."
