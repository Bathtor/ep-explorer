body = "Baseline commit 5f9ed96. Experiment: pinning Three.js 0.186.0 alone let Vite build, increasing the minified JavaScript from about 346 to 402 kB gzip, but Safari stopped at Loading 3/3 with TypeError: undefined is not a constructor at new THREE.Geometry. A Scala.js ESModule spike with direct imports from three and three/addons/controls/OrbitControls.js compiled and bundled. Restored all experimental package and source edits, reinstalled the locked r88 dependency, and confirmed bun run build passes. Only this issue claim and investigation text remain dirty."
