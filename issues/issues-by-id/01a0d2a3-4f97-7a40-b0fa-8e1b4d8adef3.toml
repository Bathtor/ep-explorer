title = "Upgrade the inlined facade and runtime to modern Three.js"
body = "Scope: After the r88 facade and local runtime work, select and pin a modern Three.js release. Migrate the local Scala.js facades and application call sites to that API, use Scala.js ES module imports where suitable, and bundle the linked Scala.js output with Three and official addons using Bun. Replace removed Geometry APIs, legacy global addon scripts and obsolete post-processing and colour handling. Keep the JavaScript dependency reproducible from a clean checkout. Acceptance: compile and linking succeed; a browser smoke check covers scene rendering, controls, intersections, labels and post-processing with the selected release; obsolete r88 assets are removed. Estimate: roughly 350-900 LOC of facade and application migration plus 80-200 LOC of bundling and page wiring. Re-estimate and split again if verified scope exceeds 1000 LOC."
