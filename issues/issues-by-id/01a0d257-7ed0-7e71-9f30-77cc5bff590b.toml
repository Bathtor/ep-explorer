title = "Add initial automated tests for core map logic"
body = """
Scope: Add a Scala.js compatible test framework and a small set of meaningful tests for pure behaviour, starting with Roman numeral conversion and one orbit or distance calculation that can be exercised without a browser. Keep test fixtures deterministic and independent of external services.

