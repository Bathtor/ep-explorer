title = "Restore compilation and runnable Scala.js output"
body = "Scope: Finish a self-contained Vite site with Bun and Scala.js linker output. Keep a minimal HTML shell with an immediate CSS loading spinner, a no-script message, and a timed recovery hint. Move local styles into the Vite graph; install Play and Font Awesome Free via Bun and import their CSS. Load the r88 Three.js ESM core and ordered legacy add-ons through Vite while preserving the mutable THREE global required by the current Scala.js facades. Load Scala.js after those dependencies. Remove the generated jsdeps bundle and its script/ignore rule once the module path works. Remove the legacy analytics snippet; hitkeep integration belongs to epexplorer-mni. The modern Three.js upgrade stays in epexplorer-oup. Have preview build before serving to avoid stale output. Keep useful README commands. Acceptance: development and production builds work from a clean checkout, Firefox or Safari browser smoke covers map rendering, Mars overlay hover, icons and fonts, and local assets resolve. Update the static release task contract for Vite output. Automatic relinking during development is separately tracked in epexplorer-c2l. Estimate: roughly 120-250 LOC plus lockfile and stylesheet moves."
