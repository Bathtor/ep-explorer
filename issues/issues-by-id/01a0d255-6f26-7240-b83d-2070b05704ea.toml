ref = "epexplorer-5r3"
title = "Publish a complete static release archive"
body = """
Publish a versioned, self-contained archive of the production static site. A standard web server should be able to serve the unpacked files without running sbt or a JVM on the deployment host.

Required result

- Publish a downloadable release archive with an unambiguous version, source commit, download URL, and SHA-256 checksum. Document the archive format and its top-level directory layout.
- The archive must contain one complete production web root: index.html, the Vite-generated JavaScript and CSS output, images, models, fonts, and every other locally served file required by the site. Include source maps if they are part of the intended public release. Exclude build caches and files the browser does not need.
- All local asset references must resolve when the unpacked archive is served from a website root. Preserve the production entry point and working map behaviour without relying on the former epmapviewer-jsdeps.js file.
- Build the production archive with VITE_HITKEEP_HOST=https://stats.lkroll.com, so the optional Hitkeep tracker is initialised in the published site.
- The release process should work from a clean checkout with documented build dependencies, without relying on unpublished Maven-local state or the old rsync destination. Split substantial dependency or build modernisation into child tasks as needed.
- Document how to produce, inspect, publish, and verify a release. Validate the archive under a simple static HTTP server: load the entry page, confirm local assets return successfully, and exercise representative map rendering and interaction in a browser.

The current deploy.sh runs sbt fullOptJS and uploads the sbt target tree with rsync. This task defines the release artifact contract; implementation can be split into child issues and refined here. Retire the old deployment script after the new release process has been accepted.

Release execution agreed 2026-09-26

The user reports that all workflows have been tested and work as expected, and requests a full release. Bump the sbt minor version from 0.6.2 to 0.7.0, commit the worktree on master, create a v0.7.0 tag on that commit, and push master and the tag. Verify the remote release workflow and published archive and checksum after the push. Do not change the fixed-version parser test fixture merely because the application version changes. Release code change estimate: one line in mapviewer.sbt, plus issue metadata; well below 1000 LOC. Keep this issue open until the published release has been inspected and remaining release-contract work is accepted."""
