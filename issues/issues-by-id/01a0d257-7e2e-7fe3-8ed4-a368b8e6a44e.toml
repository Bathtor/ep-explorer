title = "Resolve and update application dependencies reproducibly"
body = """
Scope: Replace Bintray, dynamic version selectors, and reliance on Maven Local in mapviewer.sbt. Select compatible versions of scalajs-dom, scalatags, scalajs-java-time, scribe, squants, and common-data-tools. Keep the existing Three.js facade and runtime pairing unless a verified incompatibility requires a change. Make the existing custom facade available from a reproducible, pinned source or published artifact and document the setup.

Acceptance: Dependencies resolve in a clean environment with no unpublished local Ivy or Maven artifacts; versions and repositories are deterministic; the existing facade and JavaScript asset source are reproducible. Record any concrete compatibility failure separately before proposing a facade migration. The working-build task owns any application source changes.

Estimate: about 20-80 LOC for dependency declarations, repository configuration, and documentation. A verified facade migration would be a separate task with its own plan and estimate."""
