title = "Resolve and update application dependencies reproducibly"
body = """
Scope: Replace Bintray, dynamic version selectors, and reliance on Maven Local in mapviewer.sbt. Select versions of scalajs-dom, scalatags, scalajs-java-time, scribe, squants, common-data-tools, Three.js, and the custom threejs-facade that can work with the chosen Scala/Scala.js toolchain. Decide whether the facade is rebuilt from a pinned source revision, replaced, or brought into this repository, and document the choice. Keep Three.js runtime and facade versions compatible.

Acceptance: Dependencies resolve in a clean environment with no unpublished local Ivy or Maven artifacts; versions and repositories are deterministic; the custom facade and JavaScript asset source are reproducible; document any dependency requiring separate follow-up work. The later application port owns source API changes and successful compilation.

Estimate: roughly 80-250 LOC of build and documentation changes, plus any separately tracked facade work. If adapting the facade is substantial, create a dedicated child task before implementation."""
